# Base configuration shared by all experiments.
#
# Each experiment yaml inherits from this file and overrides only the fields
# that vary. Inheritance is resolved in trainer/agent_rl_main.py
# (load_config -> OmegaConf.merge over `defaults: [../base]`).
#
# IMPORTANT (verl Hydra compatibility):
# This file is an OVERLAY, not a complete verl config. Every field below lives
# under verl's canonical key path (actor_rollout_ref.model.path,
# actor_rollout_ref.actor.*, data.*, algorithm.*, trainer.*) so it takes effect
# when merged on top of verl's `ppo_trainer` defaults. On the training cluster
# the full verl defaults are composed first (Hydra `defaults: [ppo_trainer]`
# or `--config-name`), then this overlay + the experiment yaml are merged in.
# The `agent_rl:` section is our own custom rollout config and is read only by
# trainer/agent_rollout_manager.py (verl ignores it).

# config for actor, rollout and reference model (verl: actor_rollout_ref)
actor_rollout_ref:

  # Base model -- Qwen3.5-9B (local weights).
  # Override `path` to a local cache (e.g. /mnt/afs_toolcall/sunhao4/models/Qwen3.5-9B).
  #
  # ★ 训练起点 = π₀（初始 Qwen3.5-9B）。
  #   注意区分：model.path = 训练起点；ref.path = KL 锚点 π_ref。
  model:
    path: /mnt/afs_toolcall/sunhao4/models/Qwen3.5-9B   # π₀ 本地权重; 4gpu/16gpu config 均可再 override

  # Rollout (generation) config
  rollout:
    n: 8                          # traj/query (GRPO group size M)
    temperature: 1.0
    # Custom rollout via our session scheduler (16x8 + winner-sync). verl's
    # official injection point (ray_trainer.py:931): when set, verl uses our
    # AgentLoopManager instead of the default batch rollout, WITHOUT touching
    # fit(). Default OFF (commented) -> verl-native rollout. Enable to route
    # rollout through rollout/scheduler.py with sandbox + winner-sync.
    # agent:
    #   agent_loop_manager_class: trainer.agent_rollout_manager.AgentLoopManager
    #   sessions_per_step: 16       # 16 sessions in parallel (x n slots = 128)
    #   sandbox_backend: e2b        # 'e2b' (Tencent) on cluster, 'local' for dev; 'aliyun' (AgentBay) = stub/留空

  # Reference policy pi_ref -- KL 锚点。
  # verl 0.8.0:ref policy 融合进 actor worker,其权重路径**统一取共享的
  # actor_rollout_ref.model.path**(main_ppo.py:264),ref 段本身**不接受** `path`
  # 或 `model` 子键(schema 为 FSDPActorConfig 类)。之前这里填扁平 `ref.path:
  # 27B` 会被合并进 ref config → 开 KL 的实验(K*)构造 ref 时
  # `FSDPActorConfig.__init__() got unexpected keyword 'path'` 崩(b1 无 KL 不建 ref
  # 故不崩)。故此处**不设 path**;ref 用共享 model.path(=π₀ 的 9B)。若要 π_{t-1}
  # 锚点(K4/K5),改共享 model.path 或用 verl 支持的 ref 专属字段,不要加扁平 path。
  ref: {}

  # Actor (policy optimization) config
  actor:
    entropy_coeff: 0.001          # lambda_4, FIXED across all phases (anti Echo Trap)
    ppo_mini_batch_size: 64       # =train_batch(全 batch 单更);×n8=512 轨迹 % DP4=0。单一信源,实验不再覆盖
    use_kl_loss: false            # toggled per experiment
    kl_loss_coef: 0.0             # lambda_2, set per experiment
    kl_loss_type: low_var_kl      # reverse-KL family in verl
    # Stock verl PPO/GRPO objective -- no custom policy_loss.loss_mode, no
    # set_loss_fn injection. Training uses verl's default loss_mode ("vanilla").

# Data
data:
  # 打标后的训练数据(scripts/labeled_to_parquet.py 产物)。可用 TRAIN_FILES/VAL_FILES 覆盖。
  train_files: ${oc.env:TRAIN_FILES,/mnt/afs_toolcall/sunhao4/workspace/agentic_cl_research/datasets/train_cl.parquet}
  val_files: ${oc.env:VAL_FILES,/mnt/afs_toolcall/sunhao4/workspace/agentic_cl_research/datasets/val.parquet}
  train_batch_size: 64             # 64 query/step ×n8=512 轨迹;3200/桶÷64=50 步/桶。单一信源,实验 config 不再各自覆盖(全改一处)
  gen_batch_size: 64               # rollout 生成 batch(对齐 train)
  dataloader_num_workers: 4

# Algorithm
algorithm:
  adv_estimator: grpo

# Reward -- MODEL JUDGE (no rules; see trainer/model_reward.py "Why NOT rules").
# A single frozen LLM judge grades every trajectory on one consistent scale.
# verl naive manager calls trainer/model_reward.py::compute_score per sample;
# the judge model is NOT hardcoded -- it is resolved from env (launch with
# scripts/serve_reward_model.sh, then export REWARD_API_BASE + REWARD_MODEL).
reward:
  # 训练 reward 在 ROLLOUT 阶段内联算好并写进 rm_scores(agent_rollout_manager.py:
  # generate_sequences -> _score_all_slots(observer diff + judge) -> t.reward ->
  # trajectories_to_dataproto 的 rm_scores 张量)。verl use_rm=false 时直接读
  # batch["rm_scores"],不调用 reward_manager。故 reward_manager 用默认 naive 即可
  # (不会被调,rm_scores 已存在);custom_reward_function 作兜底路径留着。
  # 注:trainer/observer_reward_manager.py 是那条「verl reward-loop」平行路径的适配,
  # 当前不接入(reward 走 rollout 内联),保留仅备用,见该文件顶部说明。
  reward_manager:
    name: naive
  custom_reward_function:
    path: src/trainer/model_reward.py
    name: compute_score
  reward_model:
    enable: false                 # judge is served externally, not a verl RM worker

# Custom rollout parameters for the multi-agent session scheduler.
# verl does NOT parse this top-level section, so put custom keys here rather than
# under rollout.agent (AgentLoopConfig is a strict dataclass that raises on any
# unexpected key -- debug doc §21). Read by trainer/agent_rollout_manager.py from
# self.config.agent_rl.rollout.
agent_rl:
  rollout:
    sessions_per_step: 64         # rollout 并发:同时跑的轨迹数(per-row,每 session 1 条)。
                                  # 512条/step;=64→8批,=512→1批。须 <= lightllm running_max_req_size。
                                  # 每实验在 run/ 覆盖。
    # max_single_gen_tokens: <int>  # 单次生成上限(与整条闸门解耦);缺省回退 rollout.response_length。


# Trainer (verl key paths)
trainer:
  total_epochs: 1
  total_training_steps: 100       # verl: total_training_steps (was total_steps)
  save_freq: 25
  test_freq: 25
  project_name: self-evolving-agent-rl   # swanlab 项目名
  # experiment_name: run/*.yaml 覆盖，verl 据此建 swanlab run
  # logger 用字面 list（不用 ${oc.decode:...} 插值）：oc.decode 按 OmegaConf 设计只能返回
  # 标量，返回 list 会在 verl_runner 的 OmegaConf.resolve 阶段报 UnsupportedValueType。
  # 想切后端就改这行；各实验 config 可覆盖（如 debug 只留 [console]）。
  logger: [console, swanlab]   # SWANLAB_API_KEY via load_training_env.sh
  # 全量记录（正式训练）：验证生成文本记 SwanLab + rollout/val 文本落盘。
  # 路径由启动脚本按实验注入 logs/experiments/<exp>/{rollout,val}；
  # 不设 env 时为 null（本地 debug 不强制落盘）。
  log_val_generations: 50
  rollout_data_dir: ${oc.decode:${oc.env:ROLLOUT_DATA_DIR,null}}
  validation_data_dir: ${oc.decode:${oc.env:VAL_DATA_DIR,null}}
