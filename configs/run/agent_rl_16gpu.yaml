# =============================================================================
# 16-GPU 正式训练配置（2 节点 × 8 卡）——自进化 RL 系统 20-step 训练
# =============================================================================
#
# 目的：在 16×H800 上跑 20 步强化学习训练，验证整套自进化系统能被真正"驱动起来"。
# 采用标准 GRPO（非算法最优，只为证明系统可行）。采样走 verl 原生 V1 agent_loop
# （RemoteAgentLoopManager + e2b 沙箱 harness），奖励走差分驱动的外部裁判。
#
# 采样规模设计（自进化核心）：推理 batch (S×n) 与训练 batch (N×n) 解耦。
# 推理超生 S=2N，rollout 产 S×n 条轨迹；训练只取 N×n 条梯度最优的
# （淘汰+选组在 rollout 后、GRPO 前做，待实现）。
#   - 16-GPU: N=64, S=128, n=8 → 推理 1024 条, 训练 512 条/step
#
# 启动（长任务，必须 tmux/nohup 后台）：
#   tmux new -d -s train 'bash scripts/train_16gpu.sh configs/run/agent_rl_16gpu.yaml'
#   tmux attach -t train
#
# 模型：Qwen3.5-9B（remove_padding + flash_attn3 变长打包，GDN 结构）。

defaults:
  - ../_generated_ppo_trainer
  - ../base

# ── 模型（Qwen3.5-9B，remove_padding + flash_attn3 变长打包）──────────────────
actor_rollout_ref:
  model:
    path: ${oc.env:MODEL_PATH,/mnt/afs_toolcall/sunhao4/models/Qwen3.5-9B}
    model_type: custom_language_model   # 引擎选择键：CustomFSDPEngineWithLMHead（GDN 变长+路由重放）
    use_remove_padding: true
    use_fused_kernels: true
    enable_gradient_checkpointing: true
    fused_kernel_options:
      impl_backend: triton              # torch backend FusedLinearForPPO chunk bug；triton 绕开
    override_config:
      attn_implementation: flash_attention_3

  # ── 训练引擎（16 GPU FSDP2, SP=4 → DP=4）─────────────────────────────────────
  actor:
    strategy: fsdp2
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.001               # 固定开启，防 Echo Trap（策略多样性坍缩）
    use_torch_compile: false
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    optim:
      lr: 2.0e-6
      lr_warmup_steps_ratio: 0.03
      lr_scheduler_type: constant
    use_dynamic_bsz: true
    ppo_mini_batch_size: 64             # = N (选组后训练的 query 数, ×n=8 → 512 条/更新)
    ppo_max_token_len_per_gpu: 32768    # = max_token_length(131072)/SP(4)
    ulysses_sequence_parallel_size: 4   # SP=4 → DP=16÷4=4
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      reshard_after_forward: true
      model_dtype: bfloat16

  # ── rollout：verl 原生 V1 agent_loop（RemoteAgentLoopManager + e2b 沙箱）──────
  rollout:
    name: lightllm
    mode: async
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.65        # 16卡 colocate 训练+跨节点NCCL，砍 KV 池留余量
    n: 8                                # traj/query（GRPO 组大小）
    load_format: auto
    max_model_len: 65536                # Hermes Agent 要求 >=64K context
    max_num_batched_tokens: 6144
    enable_chunked_prefill: false
    calculate_log_probs: true           # rollout 带回 logprob → PPO clip/ppo_kl 生效
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 32768
    response_length: 12288
    agent:
      agent_loop_manager_class: recipe_custom.agent.agent_loop_manager.RemoteAgentLoopManager
      agent_loop_config_path: configs/exps/agent_loop_config.yaml
      default_agent_loop: multi_turn_hermes_agent  # single-turn pass-through (multi-turn is cross-step)
    custom:
      remote_agent:
        gateway_count: 8
        num_session_workers: 8
        session_timeout: 2400
        harness_log_dir: ${oc.env:HARNESS_LOG_DIR,logs/harness}
        harness_log_save_mode: all
        all_failed_policy: skip
    multi_turn:
      format: qwen3_coder
      reasoning_format: qwen3
      max_assistant_turns: 6
      max_tool_response_length: 16384
    checkpoint_engine:
      update_weights_bucket_megabytes: 3072
    engine_kwargs:
      lightllm:
        batch_max_tokens: 6144
        enable_multimodal: false
        enable_torch_memory_saver: true
        graph_max_batch_size: 64
        running_max_req_size: 64        # 16卡=8副本，每步512轨迹÷8=64/副本
        sampling_backend: flashinfer
        disable_vision: true
        disable_audio: true
        disable_symm_mem_allreduce: true

  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

  nccl_timeout: 3600

# ── reward：omni RewardManager → per-row reward_fn → 外部裁判（差分驱动）──────
reward:
  reward_manager:
    name: omni
  reward_model:
    enable: false
    rollout:
      name: vllm

# ── data: 超生+选组 ──────────────────────────────────────────────────────────
# verl 约束: train_batch_size 必须是 gen_batch_size 的整数倍(train = k × gen).
# 我们的范式: rollout 产 S×n 条轨迹(S=超生量), 选组层从 S 组选 N 组训练.
# 故令 train_batch_size = S (verl 一步处理 S 个 prompt = 超生量),
#     gen_batch_size = N (抓取块, S 是 N 的倍数, 满足 verl).
# 选组层(淘汰+选 N 组)在 _step_once 的 sample 后、advantage 前做(待实现).
#   16-GPU: N=64, S=128, n=8 → rollout 1024 条, 选组后训练 512 条.
data:
  train_files: ${oc.env:TRAIN_FILES,/mnt/afs_toolcall/sunhao4/workspace/self-evolving-agent-rl/datasets/train_coding_3200.parquet}  # 纯 coding 3200 条 = 50 步 × 64/步
  val_files: ${oc.env:VAL_FILES,null}
  train_batch_size: 128                  # S=2N=128 (超生量: verl 一步处理 128 prompt → rollout 1024 条)
  gen_batch_size: 64                     # N=64 (抓取块; 128 是 64 的倍数, 满足 verl; 选组后训练 512 条)
  max_prompt_length: 4096
  max_response_length: 12288
  shuffle: false
  return_raw_chat: true
  filter_overlong_prompts: true
  trust_remote_code: true
  dataloader_num_workers: 4
  cache_dir: /tmp/verl_rlhf_cache

# ── algorithm：rollout/train 策略 IS 修正 ─────────────────────────────────────
algorithm:
  adv_estimator: grpo
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

# ── trainer：16 GPU 2 节点，20-step 正式训练 ──────────────────────────────────
trainer:
  nnodes: ${oc.env:NNODES,2}
  n_gpus_per_node: ${oc.env:N_GPUS_PER_NODE,8}
  total_epochs: 1
  total_training_steps: 50             # 自进化 50-step 训练 (coding 3200 条 = 50×64)
  save_freq: 10                        # 每 10 步存一次 checkpoint
  test_freq: -1                        # 离线评测，关在线验证
  val_before_train: false
  critic_warmup: 0
  logger: [console, swanlab]            # 正式训练记 swanlab
  log_val_generations: 50
  project_name: self-evolving-agent-rl
  experiment_name: agent_rl_16gpu
  default_local_dir: ${oc.env:CKPT_DIR,ckpts/agent_rl_16gpu}
  use_v1: true
  v1:
    trainer_mode: agent_rl_sync      # 自进化 trainer: 超生+淘汰+选组 (advantage-driven)
    sampler:
      custom_sampler:
        path: null
        name: null

# transfer_queue：V1 数据通道，custom_sync 必须开。
transfer_queue:
  enable: true

ray_kwargs:
  ray_init:
    address: auto
    num_cpus: null
